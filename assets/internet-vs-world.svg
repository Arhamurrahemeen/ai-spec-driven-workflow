<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="The internet shows you what got written down. The world contains everything that didn't.">
  <defs>
    <pattern id="dots-hero-inc" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="#F4EEE2"/>
  <rect width="1200" height="460" fill="url(#dots-hero-inc)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">THE GAP THAT MISLEADS YOU</text>
  <line x1="500" y1="66" x2="700" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">Two versions of the same subject. Only one exists on your screen.</text>

  <!-- Left card: internet -->
  <g>
    <rect x="80" y="140" width="500" height="280" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="140" width="5" height="280" fill="#8A8275"/>
    <text x="100" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">WHAT THE INTERNET SHOWS YOU</text>
    <text x="100" y="220" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#1C1B19">The published version</text>
    <line x1="100" y1="240" x2="180" y2="240" stroke="#8A8275" stroke-width="1"/>

    <text x="100" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Papers, posts, tutorials, market reports.</text>
    <text x="100" y="304" font-family="Georgia, serif" font-size="14" fill="#3A372F">Successes that were worth writing down.</text>
    <text x="100" y="330" font-family="Georgia, serif" font-size="14" fill="#3A372F">Confident claims. Clean diagrams.</text>
    <text x="100" y="356" font-family="Georgia, serif" font-size="14" fill="#3A372F">Data from three years ago,</text>
    <text x="100" y="376" font-family="Georgia, serif" font-size="14" fill="#3A372F">still ranking on page one.</text>

    <text x="100" y="410" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#B25C3F">Feels like the whole picture. Isn't.</text>
  </g>

  <!-- Right card: reality -->
  <g>
    <rect x="620" y="140" width="500" height="280" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="620" y="140" width="5" height="280" fill="#539091"/>
    <text x="640" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#539091">WHAT THE WORLD ACTUALLY CONTAINS</text>
    <text x="640" y="220" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#1C1B19">Everything else</text>
    <line x1="640" y1="240" x2="720" y2="240" stroke="#539091" stroke-width="1"/>

    <text x="640" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">The failures nobody bothered to publish.</text>
    <text x="640" y="304" font-family="Georgia, serif" font-size="14" fill="#3A372F">The X factor that killed someone's build.</text>
    <text x="640" y="330" font-family="Georgia, serif" font-size="14" fill="#3A372F">The market that quietly matured</text>
    <text x="640" y="350" font-family="Georgia, serif" font-size="14" fill="#3A372F">while you weren't looking.</text>
    <text x="640" y="376" font-family="Georgia, serif" font-size="14" fill="#3A372F">The knowledge that stayed in people's heads.</text>

    <text x="640" y="410" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">Only accessible by leaving the screen.</text>
  </g>
</svg>
