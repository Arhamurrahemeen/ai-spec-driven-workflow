<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Pull quote: The more you fuck around, the more you find out.">
  <defs>
    <pattern id="dots-close" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1000" height="280" fill="#F4EEE2"/>
  <rect width="1000" height="280" fill="url(#dots-close)"/>
  <rect x="60" y="40" width="880" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
  <rect x="60" y="40" width="5" height="200" fill="#539091"/>
  <text x="500" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="5" fill="#8A8275">THE ONLY REAL RESEARCH METHOD</text>
  <text x="500" y="150" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="36" fill="#1C1B19">The more you fuck around,</text>
  <text x="500" y="195" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="36" fill="#539091">the more you find out.</text>
  <text x="500" y="225" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="4" fill="#8A8275">— ARHAM</text>
</svg>
