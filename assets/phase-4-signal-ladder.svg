<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Phase 4: three signals that count as a real pilot outcome. They pay you, they commit real time, or they introduce you unprompted. Anything less is a nice conversation.">
  <defs>
    <pattern id="dots-p4" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="#F4EEE2"/>
  <rect width="1200" height="500" fill="url(#dots-p4)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">PHASE 04 · SIGNALS THAT COUNT</text>
  <line x1="510" y1="66" x2="690" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">Compliments are cheap. A signal costs the customer something.</text>

  <!-- Signal 1: strongest -->
  <g>
    <rect x="80" y="140" width="1040" height="90" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="140" width="5" height="90" fill="#539091"/>
    <text x="110" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">01 · STRONGEST</text>
    <text x="110" y="210" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">They pay you.</text>
    <text x="410" y="196" font-family="Georgia, serif" font-size="14" fill="#3A372F">Any amount. Even a token amount.</text>
    <text x="410" y="218" font-family="Georgia, serif" font-size="14" fill="#3A372F">If money changes hands, the market has spoken.</text>
  </g>

  <!-- Signal 2 -->
  <g>
    <rect x="80" y="250" width="1040" height="90" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="250" width="5" height="90" fill="#539091"/>
    <text x="110" y="286" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">02 · REAL</text>
    <text x="110" y="320" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">They commit their time.</text>
    <text x="510" y="306" font-family="Georgia, serif" font-size="14" fill="#3A372F">Two weeks, a month, structured feedback.</text>
    <text x="510" y="328" font-family="Georgia, serif" font-size="14" fill="#3A372F">Unpaid — but a working operator's time is money.</text>
  </g>

  <!-- Signal 3 -->
  <g>
    <rect x="80" y="360" width="1040" height="90" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="360" width="5" height="90" fill="#539091"/>
    <text x="110" y="396" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">03 · UNBOUGHT</text>
    <text x="110" y="430" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">They introduce you.</text>
    <text x="500" y="416" font-family="Georgia, serif" font-size="14" fill="#3A372F">Unprompted. They walk you to someone else in</text>
    <text x="500" y="438" font-family="Georgia, serif" font-size="14" fill="#3A372F">the industry and vouch for what you built.</text>
  </g>

  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#B25C3F">None of the three? You don't have a pilot. You have a nice conversation.</text>
</svg>
