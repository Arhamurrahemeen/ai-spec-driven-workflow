<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Phase 3: a product is designed to be used for a long time by many people. A probe is designed to answer a single question and then be thrown away.">
  <defs>
    <pattern id="dots-p3" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="#F4EEE2"/>
  <rect width="1200" height="460" fill="url(#dots-p3)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">PHASE 03 · WHICH ONE ARE YOU BUILDING</text>
  <line x1="510" y1="66" x2="690" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">A product answers many. A probe asks one.</text>

  <!-- Product card -->
  <g>
    <rect x="80" y="140" width="500" height="280" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="140" width="5" height="280" fill="#8A8275"/>
    <text x="100" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">WHAT ENGINEERS BUILD BY DEFAULT</text>
    <text x="100" y="220" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#1C1B19">A product</text>
    <line x1="100" y1="240" x2="180" y2="240" stroke="#8A8275" stroke-width="1"/>

    <text x="100" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Designed for many people over a long time.</text>
    <text x="100" y="304" font-family="Georgia, serif" font-size="14" fill="#3A372F">Auth, settings, error states, polish.</text>
    <text x="100" y="330" font-family="Georgia, serif" font-size="14" fill="#3A372F">Many workflows. Deployment. Hosting.</text>
    <text x="100" y="356" font-family="Georgia, serif" font-size="14" fill="#3A372F">Beautiful, complete, ready to ship.</text>

    <text x="100" y="398" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#B25C3F">Cost: two weeks you don't have.</text>
  </g>

  <!-- Probe card -->
  <g>
    <rect x="620" y="140" width="500" height="280" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="620" y="140" width="5" height="280" fill="#539091"/>
    <text x="640" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#539091">WHAT PHASE 3 ACTUALLY NEEDS</text>
    <text x="640" y="220" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#1C1B19">A probe</text>
    <line x1="640" y1="240" x2="720" y2="240" stroke="#539091" stroke-width="1"/>

    <text x="640" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Designed to answer one question, then thrown away.</text>
    <text x="640" y="304" font-family="Georgia, serif" font-size="14" fill="#3A372F">One screen. One workflow. No login. No polish.</text>
    <text x="640" y="330" font-family="Georgia, serif" font-size="14" fill="#3A372F">Hardcoded data. Runs on your laptop.</text>
    <text x="640" y="356" font-family="Georgia, serif" font-size="14" fill="#3A372F">Ugly. Embarrassing. Carried in a bag.</text>

    <text x="640" y="398" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">Purpose: create the moment where the customer reacts.</text>
  </g>
</svg>
