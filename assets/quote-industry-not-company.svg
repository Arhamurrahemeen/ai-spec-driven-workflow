<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Pull quote: I don't want to own a company. I want to own an industry.">
  <defs>
    <pattern id="dots-q1" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1000" height="260" fill="#F4EEE2"/>
  <rect width="1000" height="260" fill="url(#dots-q1)"/>
  <rect x="60" y="40" width="880" height="180" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
  <rect x="60" y="40" width="5" height="180" fill="#539091"/>
  <text x="500" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="5" fill="#8A8275">THE THING THAT STARTED IT</text>
  <text x="500" y="138" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#1C1B19">I don't want to own a company.</text>
  <text x="500" y="178" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="30" fill="#539091">I want to own an industry.</text>
  <text x="500" y="208" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="4" fill="#8A8275">— ARHAM</text>
</svg>
