<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Two projects where the internet misled me: VitalSense and the IoT quadcopter. Both times, real humans filled in what the internet left out.">
  <defs>
    <pattern id="dots-proj" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="#F4EEE2"/>
  <rect width="1200" height="500" fill="url(#dots-proj)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">THIS ISN'T NEW FOR ME</text>
  <line x1="530" y1="66" x2="670" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">Same lesson, twice. Both times the humans knew what the internet didn't.</text>

  <!-- VitalSense card -->
  <g>
    <rect x="80" y="140" width="500" height="320" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="80" y="140" width="5" height="320" fill="#539091"/>
    <text x="100" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">CASE 01 · VITALSENSE</text>
    <text x="100" y="220" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">The market wasn't empty.</text>
    <text x="100" y="250" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">It was quiet.</text>
    <line x1="100" y1="266" x2="180" y2="266" stroke="#539091" stroke-width="1"/>

    <text x="100" y="300" font-family="Georgia, serif" font-size="14" fill="#3A372F">The internet said rPPG had huge demand</text>
    <text x="100" y="320" font-family="Georgia, serif" font-size="14" fill="#3A372F">and no one was working on it. True —</text>
    <text x="100" y="340" font-family="Georgia, serif" font-size="14" fill="#3A372F">in the 2010s. By 2017, better algorithms</text>
    <text x="100" y="360" font-family="Georgia, serif" font-size="14" fill="#3A372F">and real research were already done.</text>

    <text x="100" y="398" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">Where I found the truth:</text>
    <text x="100" y="420" font-family="Georgia, serif" font-size="13" fill="#3A372F">LinkedIn, after I posted my AI-accelerated</text>
    <text x="100" y="438" font-family="Georgia, serif" font-size="13" fill="#3A372F">version. Engineers reached out and shared</text>
    <text x="100" y="456" font-family="Georgia, serif" font-size="13" fill="#3A372F">the X factor that killed their builds.</text>
  </g>

  <!-- Quadcopter card -->
  <g>
    <rect x="620" y="140" width="500" height="320" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="620" y="140" width="5" height="320" fill="#539091"/>
    <text x="640" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">CASE 02 · IOT QUADCOPTER</text>
    <text x="640" y="220" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">Datasheets don't teach</text>
    <text x="640" y="250" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">markets.</text>
    <line x1="640" y1="266" x2="720" y2="266" stroke="#539091" stroke-width="1"/>

    <text x="640" y="300" font-family="Georgia, serif" font-size="14" fill="#3A372F">Every build guide and datasheet online</text>
    <text x="640" y="320" font-family="Georgia, serif" font-size="14" fill="#3A372F">told me what to solder. None of them</text>
    <text x="640" y="340" font-family="Georgia, serif" font-size="14" fill="#3A372F">told me what the industry was doing,</text>
    <text x="640" y="360" font-family="Georgia, serif" font-size="14" fill="#3A372F">what it wanted, or where it hurt.</text>

    <text x="640" y="398" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">Where I found the truth:</text>
    <text x="640" y="420" font-family="Georgia, serif" font-size="13" fill="#3A372F">A semester expo. Experts walked over,</text>
    <text x="640" y="438" font-family="Georgia, serif" font-size="13" fill="#3A372F">told me what they'd seen, what fails</text>
    <text x="640" y="456" font-family="Georgia, serif" font-size="13" fill="#3A372F">in the field, and where the money is.</text>
  </g>
</svg>
