<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="The five phases of starting a startup: kill the idea on paper, walk the market, build a probe, get one pilot, read the market">
  <defs>
    <pattern id="dots-flow" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#F4EEE2"/>
  <rect width="1200" height="420" fill="url(#dots-flow)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">THE FIVE PHASES</text>
  <line x1="540" y1="66" x2="660" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#1C1B19">From an idea on paper to a market that lets you in</text>

  <!-- Connecting line -->
  <line x1="110" y1="260" x2="1090" y2="260" stroke="#8A8275" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Phase 1 -->
  <g>
    <rect x="40" y="160" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="40" y="160" width="5" height="200" fill="#539091"/>
    <text x="60" y="192" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">PHASE 01</text>
    <text x="60" y="228" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">Kill it on</text>
    <text x="60" y="252" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">paper</text>
    <text x="60" y="296" font-family="Georgia, serif" font-size="13" fill="#3A372F">Three sentences.</text>
    <text x="60" y="316" font-family="Georgia, serif" font-size="13" fill="#3A372F">No hedging.</text>
    <text x="60" y="336" font-family="Georgia, serif" font-size="13" fill="#3A372F">No laptop yet.</text>
  </g>

  <!-- Phase 2 -->
  <g>
    <rect x="264" y="160" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="264" y="160" width="5" height="200" fill="#539091"/>
    <text x="284" y="192" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">PHASE 02</text>
    <text x="284" y="228" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">Walk the</text>
    <text x="284" y="252" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">market</text>
    <text x="284" y="296" font-family="Georgia, serif" font-size="13" fill="#3A372F">Is the market</text>
    <text x="284" y="316" font-family="Georgia, serif" font-size="13" fill="#3A372F">open? Not just —</text>
    <text x="284" y="336" font-family="Georgia, serif" font-size="13" fill="#3A372F">is the problem real?</text>
  </g>

  <!-- Phase 3 -->
  <g>
    <rect x="488" y="160" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="488" y="160" width="5" height="200" fill="#539091"/>
    <text x="508" y="192" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">PHASE 03</text>
    <text x="508" y="228" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">Build a</text>
    <text x="508" y="252" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">probe</text>
    <text x="508" y="296" font-family="Georgia, serif" font-size="13" fill="#3A372F">Not a product.</text>
    <text x="508" y="316" font-family="Georgia, serif" font-size="13" fill="#3A372F">One question.</text>
    <text x="508" y="336" font-family="Georgia, serif" font-size="13" fill="#3A372F">Two weeks.</text>
  </g>

  <!-- Phase 4 -->
  <g>
    <rect x="712" y="160" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="712" y="160" width="5" height="200" fill="#539091"/>
    <text x="732" y="192" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">PHASE 04</text>
    <text x="732" y="228" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">Get one</text>
    <text x="732" y="252" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">pilot</text>
    <text x="732" y="296" font-family="Georgia, serif" font-size="13" fill="#3A372F">With a price</text>
    <text x="732" y="316" font-family="Georgia, serif" font-size="13" fill="#3A372F">attached — even</text>
    <text x="732" y="336" font-family="Georgia, serif" font-size="13" fill="#3A372F">if it's free.</text>
  </g>

  <!-- Phase 5 -->
  <g>
    <rect x="936" y="160" width="200" height="200" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="936" y="160" width="5" height="200" fill="#539091"/>
    <text x="956" y="192" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">PHASE 05</text>
    <text x="956" y="228" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">Read what</text>
    <text x="956" y="252" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#1C1B19">it told you</text>
    <text x="956" y="296" font-family="Georgia, serif" font-size="13" fill="#3A372F">Plant, walk to</text>
    <text x="956" y="316" font-family="Georgia, serif" font-size="13" fill="#3A372F">the next door,</text>
    <text x="956" y="336" font-family="Georgia, serif" font-size="13" fill="#3A372F">or map the room.</text>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="4" fill="#8A8275">EACH PHASE ENDS IN A FORK · ADVANCE OR GO BACK ONE STEP</text>
</svg>
