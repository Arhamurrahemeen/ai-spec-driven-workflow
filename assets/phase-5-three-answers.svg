<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Phase 5: three legitimate answers after one pilot. Plant here, take the lessons and walk, or map what isn't yours.">
  <defs>
    <pattern id="dots-p5" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1C1B19" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="#F4EEE2"/>
  <rect width="1200" height="460" fill="url(#dots-p5)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Courier New, monospace" font-size="12" letter-spacing="5" fill="#8A8275">PHASE 05 · READ THE ANSWER HONESTLY</text>
  <line x1="490" y1="66" x2="710" y2="66" stroke="#539091" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#1C1B19">Three answers. All three are legitimate.</text>

  <!-- Card 1: Plant -->
  <g>
    <rect x="60" y="140" width="360" height="260" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="60" y="140" width="5" height="260" fill="#539091"/>
    <text x="80" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">ANSWER 01</text>
    <text x="80" y="222" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">Plant here.</text>
    <line x1="80" y1="240" x2="150" y2="240" stroke="#539091" stroke-width="1"/>
    <text x="80" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Pilot converted. Market is open.</text>
    <text x="80" y="300" font-family="Georgia, serif" font-size="14" fill="#3A372F">Buyers are reachable. Room to</text>
    <text x="80" y="322" font-family="Georgia, serif" font-size="14" fill="#3A372F">solve it exists.</text>
    <text x="80" y="360" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">One pilot → three → ten.</text>
    <text x="80" y="382" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#539091">The startup becomes a company.</text>
  </g>

  <!-- Card 2: Walk -->
  <g>
    <rect x="440" y="140" width="360" height="260" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="440" y="140" width="5" height="260" fill="#8A8275"/>
    <text x="460" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">ANSWER 02</text>
    <text x="460" y="222" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">Walk to the next door.</text>
    <line x1="460" y1="240" x2="530" y2="240" stroke="#8A8275" stroke-width="1"/>
    <text x="460" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Pilot worked. Market is wrong</text>
    <text x="460" y="300" font-family="Georgia, serif" font-size="14" fill="#3A372F">for the company you want to</text>
    <text x="460" y="322" font-family="Georgia, serif" font-size="14" fill="#3A372F">build. Sales cycles too long.</text>
    <text x="460" y="360" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#3A372F">Take the customer if they'll come.</text>
    <text x="460" y="382" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#3A372F">Take the lessons either way.</text>
  </g>

  <!-- Card 3: Map -->
  <g>
    <rect x="820" y="140" width="320" height="260" rx="6" fill="#FFFFFF" stroke="#E0D8CA" stroke-width="1"/>
    <rect x="820" y="140" width="5" height="260" fill="#B25C3F"/>
    <text x="840" y="176" font-family="Courier New, monospace" font-size="11" letter-spacing="3" fill="#8A8275">ANSWER 03</text>
    <text x="840" y="222" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1C1B19">Map what isn't yours.</text>
    <line x1="840" y1="240" x2="910" y2="240" stroke="#B25C3F" stroke-width="1"/>
    <text x="840" y="278" font-family="Georgia, serif" font-size="14" fill="#3A372F">Pilot didn't work. Market</text>
    <text x="840" y="300" font-family="Georgia, serif" font-size="14" fill="#3A372F">isn't as open as you thought.</text>
    <text x="840" y="322" font-family="Georgia, serif" font-size="14" fill="#3A372F">This is not failure.</text>
    <text x="840" y="360" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#B25C3F">You now know which ground</text>
    <text x="840" y="382" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#B25C3F">isn't yours. Write it down.</text>
  </g>

  <text x="600" y="438" text-anchor="middle" font-family="Courier New, monospace" font-size="11" letter-spacing="4" fill="#8A8275">HIDDEN FOURTH ANSWER: THE MARKET YOU PILOTED IN IS NOT THE DESTINATION</text>
</svg>
